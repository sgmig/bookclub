<!DOCTYPE html>
<div class="d-flex justify-content-between align-items-start mb-1">
    <div>
        <h3 id="club-preview-name">{{ club.name }}</h3>
        <p class="text-muted">{{ club.description }}</p>
    </div>
    <a class="btn btn-outline-primary flex-shrink-0 ms-2" href="{% url 'clubs:club-detail' club.id %}">
        Go to club page
    </a>
</div>

<h5>Next meeting</h5>
{% with next_meeting=club.next_meeting %}
{% if next_meeting %}
{% include "clubs/partials/club_meeting_detail_panel.html" with club_meeting=next_meeting %}
{% else %}
<p class="text-muted">No upcoming meetings.</p>
{% endif %}
{% endwith %}
